name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is now outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # same as Taskfile.yml
      # The example receiver is its own module, so ./... above skips it.
      - name: Lint the example receiver
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: examples/receiver

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      # Integration tests start PostgreSQL through the runner's Docker
      # daemon (Testcontainers).
      - name: Test with the race detector
        run: go test -race -count=1 ./...
      # Signs with Carteiro's code and verifies with the official Standard
      # Webhooks library: fails if a change breaks compatibility.
      - name: Test the example receiver
        working-directory: examples/receiver
        run: go test -race -count=1 ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Fails on a known high or critical vulnerability in what ships. I added
      # it after Next.js 16.4.0's remote code execution advisories, which this
      # check would have caught.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SESSION_SECRET: ci-build-only-not-a-real-secret-0123456789

  generated-code:
    name: sqlc diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check generated code is up to date
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the dashboard image
        uses: docker/build-push-action@v7
        with:
          context: dashboard
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
