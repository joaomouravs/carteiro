name: carteiro

# Shared by every service that runs the Carteiro image.
x-carteiro: &carteiro
  build:
    context: ..
  image: carteiro:dev
  environment:
    CARTEIRO_DATABASE_URL: postgres://carteiro:carteiro@postgres:5432/carteiro?sslmode=disable
    # Development only; matches .env.example.
    CARTEIRO_ADMIN_TOKEN: dev-admin-token-change-me-0123456789
    CARTEIRO_ENCRYPTION_KEY: O8/tj+OGJr/LS/NtwE200Ubox90bcg3mHHEp/6yq4Nw=
    CARTEIRO_ALLOW_HTTP_ENDPOINTS: "true"
    CARTEIRO_ALLOW_PRIVATE_NETWORKS: "true"
    # Overridable from the shell, for load tests.
    CARTEIRO_WORKER_CONCURRENCY: ${CARTEIRO_WORKER_CONCURRENCY:-10}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: carteiro
      POSTGRES_PASSWORD: carteiro
      POSTGRES_DB: carteiro
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under a versioned subdirectory of
      # /var/lib/postgresql, so the volume is mounted at the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteiro -d carteiro"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies migrations, then exits. The API starts only if it
  # succeeded.
  migrate:
    <<: *carteiro
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *carteiro
    command: ["serve"]
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *carteiro
    command: ["work"]
    # docker stop waits 10s by default before killing the process. A delivery
    # can take up to CARTEIRO_DELIVERY_TIMEOUT (15s) to finish, so shutdown
    # gets more time; anything still unfinished is recovered by its lease.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The dashboard (dashboard/, ADR 0007): http://localhost:3001, sign in with
  # an application's API key.
  dashboard:
    build:
      context: ../dashboard
    image: carteiro-dashboard:dev
    environment:
      # Server to server, inside the compose network.
      CARTEIRO_API_URL: http://api:8080
      # Development only; matches dashboard/.env.example.
      SESSION_SECRET: dev-session-secret-change-me-0123456789
    ports:
      - "3001:3001"
    depends_on:
      - api

  # The example receiver (examples/receiver), only with --profile demo. It
  # needs the secret of an endpoint created for http://receiver:9000/webhooks;
  # see "Trying it end to end" in the README.
  receiver:
    profiles: [demo]
    build:
      context: ..
      dockerfile: examples/receiver/Dockerfile
    environment:
      # Empty when unset, so other commands still work; the receiver then
      # exits with a message saying what is missing.
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}

  # Load testing (loadtest/), only with --profile loadtest. The sink is the
  # receiver: it answers 204 at once, so tests measure Carteiro.
  sink:
    profiles: [loadtest]
    image: nginx:1.29.8-alpine
    volumes:
      - ../loadtest/sink.conf:/etc/nginx/conf.d/default.conf:ro

  k6:
    profiles: [loadtest]
    image: grafana/k6:2.2.0
    volumes:
      - ../loadtest:/scripts:ro
    entrypoint: ["k6"]

  # Metrics and the dashboard, only with --profile observability: they are
  # two more images, not needed to run Carteiro.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.1.7
    environment:
      # Local demo: anyone can view the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/carteiro.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
